name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    # The E2E suite drives the BUILT bundle through five concurrent browser contexts, so
    # it needs the same build `verify` proves compiles. Its own job rather than more
    # steps on that one: a browser download plus 25 five-context scenarios roughly
    # doubles the wall clock, and a failure here means something different from a failing
    # unit test — the mechanics are proven in `verify`, so a red here is the UI or the
    # wiring between the layers.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      # Chromium is ~180 MB and does not change between runs; only the Playwright
      # version can invalidate it, so that is what the key is derived from. Without
      # this the job re-downloaded the browser on every single push.
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore the browser cache
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      # The OS libraries Chromium links against are apt packages, not part of the cached
      # directory, so this runs on a cache hit too. It is seconds, not minutes.
      - run: npx playwright install-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
